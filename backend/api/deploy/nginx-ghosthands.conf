# Ghost Hands API — nginx reverse-proxy / WebSocket forwarding template
# for Fortune's shared VPS ingress (Trace / Keepsafe pattern).
#
# Intended public host: api.ghosthands.fortunealebiosu.dev
# Upstream: Ghost Hands FastAPI container/service on the VPS loopback.
#
# Drop this (or merge the server/location blocks) into the shared ingress
# config, then reload nginx: `sudo nginx -t && sudo systemctl reload nginx`

upstream ghosthands_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ghosthands.fortunealebiosu.dev;

    # TLS certs managed by the shared ingress (certbot / existing wildcard).
    # ssl_certificate     /etc/letsencrypt/live/fortunealebiosu.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fortunealebiosu.dev/privkey.pem;

    # Harden basics (shared ingress may already set these globally).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://ghosthands_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (signaling at /ws/v1/sessions/{code})
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://ghosthands_api/healthz;
        access_log off;
    }
}

# Required map (usually already present on the shared ingress):
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 80;
    listen [::]:80;
    server_name api.ghosthands.fortunealebiosu.dev;
    return 301 https://$host$request_uri;
}
