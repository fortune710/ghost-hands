# Ghost Hands API — production-ish compose for Fortune's VPS.
# Usage (on the VPS):
#   cd /opt/ghost-hands/backend/api
#   cp ../../.env.example .env   # fill GH_* secrets
#   docker compose up -d --build
#
# Nginx on the shared ingress proxies api.ghosthands.fortunealebiosu.dev → 127.0.0.1:8000
# (see deploy/nginx-ghosthands.conf). Optional coturn: deploy/coturn.conf.template

services:
  api:
    build: .
    image: ghosthands-api:latest
    container_name: ghosthands-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GH_HOST: 0.0.0.0
      GH_PORT: "8000"
      GH_PUBLIC_API_URL: https://api.ghosthands.fortunealebiosu.dev
      GH_POINTER_BASE_URL: https://ghosthands.fortunealebiosu.dev
      GH_JOIN_BASE_URL: https://ghosthands.fortunealebiosu.dev
      GH_CORS_ORIGINS: https://ghosthands.fortunealebiosu.dev,https://staging.ghosthands.fortunealebiosu.dev
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 5
